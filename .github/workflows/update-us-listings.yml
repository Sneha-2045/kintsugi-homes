name: Update US Foreclosure Listings

on:
  schedule:
    # Runs every day at 2:00 AM IST
    - cron: "30 20 * * *"

  # Allows us to run it manually from GitHub
  workflow_dispatch:

jobs:
  update-listings:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run US foreclosure scraper
        run: python automation/scraper.py

      - name: Commit updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/us-listings.ts

          if git diff --cached --quiet; then
            echo "No listing changes to commit."
          else
            git commit -m "Update US foreclosure listings"
            git push
          fi